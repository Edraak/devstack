# Edraak Auth Service
server {
    server_name authnew.edraak.dev;
    include /etc/nginx/conf.d/includes/server.conf;

    location / {
        proxy_pass http://edraak.devstack.edraak_auth:8000;
        proxy_set_header Host $http_host;
        include /etc/nginx/conf.d/includes/proxy.conf;
    }
}
